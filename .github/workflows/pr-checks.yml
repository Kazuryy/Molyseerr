name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-title-check:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
    - name: Check PR title format
      uses: amannn/action-semantic-pull-request@v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          fix
          docs
          style
          refactor
          perf
          test
          chore
          ci
        scopes: |
          api
          service
          ui
          models
          viewmodels
          networking
          config
          deps
        requireScope: false

  pr-size-check:
    name: Check PR Size
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check PR size
      run: |
        CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | wc -l)
        CHANGED_LINES=$(git diff --shortstat origin/${{ github.base_ref }}...HEAD | awk '{print $4+$6}')

        echo "📊 PR Statistics:"
        echo "Files changed: $CHANGED_FILES"
        echo "Lines changed: $CHANGED_LINES"

        if [ "$CHANGED_FILES" -gt 50 ]; then
          echo "⚠️ Warning: PR modifies $CHANGED_FILES files. Consider splitting into smaller PRs."
        fi

        if [ "$CHANGED_LINES" -gt 1000 ]; then
          echo "⚠️ Warning: PR modifies $CHANGED_LINES lines. Consider splitting into smaller PRs."
        fi

  label-check:
    name: Auto-label PR
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Auto-label based on files
      uses: actions/labeler@v5
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        configuration-path: .github/labeler.yml

  conflict-check:
    name: Check for Merge Conflicts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for conflicts
      run: |
        git fetch origin ${{ github.base_ref }}
        if git merge-tree $(git merge-base HEAD origin/${{ github.base_ref }}) HEAD origin/${{ github.base_ref }} | grep -q '<<<<<'; then
          echo "❌ Merge conflicts detected!"
          exit 1
        else
          echo "✅ No merge conflicts"
        fi
