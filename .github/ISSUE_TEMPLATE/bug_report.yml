name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the information below to help us resolve it quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I click on..., I expect... but instead...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead...
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Apple TV Model
      description: Which Apple TV are you using?
      options:
        - Apple TV 4K (3rd generation, 2022)
        - Apple TV 4K (2nd generation, 2021)
        - Apple TV 4K (1st generation, 2017)
        - Apple TV HD (4th generation, 2015)
        - tvOS Simulator
        - Other
    validations:
      required: true

  - type: input
    id: tvos-version
    attributes:
      label: tvOS Version
      description: What version of tvOS are you running?
      placeholder: e.g., 17.0, 17.1, 18.0
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Sir Seerr Version
      description: What version of Sir Seerr are you using?
      placeholder: e.g., 1.0.0, 1.1.0-beta
    validations:
      required: true

  - type: input
    id: seerr-version
    attributes:
      label: Seerr Server Version
      description: What version of Seerr is your server running?
      placeholder: e.g., 1.0.0, 1.5.2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please copy and paste any relevant log output (if available)
      render: shell
      placeholder: |
        Paste logs here...

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem
      placeholder: Drag and drop images here

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: This started happening after...

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following
      options:
        - label: I have searched for similar issues and this is not a duplicate
          required: true
        - label: I have tested this on the latest version of Sir Seerr
          required: true
        - label: I have included all relevant information above
          required: true
